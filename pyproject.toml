[project]
name = "spindrift"
version = "0.5.0"
description = "A catalogue of games"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3",
    "gunicorn>=23.0.0",
    "pydantic>=2.13.5",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # outdated idioms for the pinned Python
    "B",    # bugbear
    "SIM",  # simplifications
    "C4",   # comprehensions
    "RET",  # returns
    "PTH",  # os.path where pathlib reads better
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.coverage.run]
source = ["spindrift"]
# The entry point builds an app against the repository's own catalogue at import time, so
# nothing measuring it may import it.
omit = ["spindrift/wsgi.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    'if __name__ == "__main__":',
]
