# Mutation testing runs on a schedule rather than per pull request. A cold sweep is minutes
# where the suite is seconds, and survivors are a slow-moving signal about the shape of the
# tests — worth knowing about the next morning, not worth holding every PR behind.
#
# It has to run on Linux to mean anything. A mutant that changes nothing but the case of a
# filename survives on a case-insensitive filesystem — macOS by default — because the
# filesystem resolves the name back to the file that exists. Those mutants survive every
# local run and die here, so this is the run that counts.
#
# `schedule` only ever runs on the default branch, so this reports on main. GitHub also
# disables scheduled workflows after 60 days without repository activity; `workflow_dispatch`
# is here to run it on demand, and to wake it up again if that happens.
name: Mutants

on:
  schedule:
    # 03:00 UTC daily.
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  mutmut:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Install dev dependencies
        run: uv sync --locked --dev

      - name: Hunt the mutants
        run: make mutants.check
