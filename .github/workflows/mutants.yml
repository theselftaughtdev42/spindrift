# Mutation testing stands apart from Tests for two reasons: a cold sweep is minutes where
# the suite is seconds, and the verdict is only trustworthy on Linux. A mutant that changes
# nothing but a filename's case survives on a case-insensitive filesystem — macOS by
# default — because the filesystem resolves the name back to the file that exists. Those
# mutants survive every local run and die here, so this is the run that counts.
name: Mutants

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  mutmut:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Install dev dependencies
        run: uv sync --locked --dev

      - name: Hunt the mutants
        run: make mutants.check
