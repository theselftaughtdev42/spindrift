name: Publish image

# Releases only. A `v*` tag is the one thing that publishes an image — `make release`
# pushes the tag, and the semver lines below turn it into the `0.2.0`, `0.2` and `latest`
# tags you pin and roll back to. Merges to main no longer build: that only ever produced
# throwaway `latest`/`sha-` images and doubled every release into two runs.
#
# Pull requests still build (never push), so a broken Dockerfile is caught before a tag is
# ever cut rather than at release time.
on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      # Not on a pull request: a PR build only proves the image still builds, and has no
      # business pushing anything.
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934 # v5.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `latest=auto` moves `latest` onto every plain release and leaves pre-release
          # tags (`v1.0.0-rc1`) alone.
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # No provenance/SBOM attestations. They wrap a single-arch build in an index
          # with an extra attestation manifest, so one release lands in the registry as
          # three objects instead of one — build metadata nobody here reads, paid for in
          # clutter. Off, a release is a single plain image manifest.
          provenance: false
          sbom: false
          # Bake the release into the image so `GET /version` can answer which build is
          # running. On a tag this is the semver (`0.2.0`); on a PR build it is unset and
          # the app falls back to pyproject.
          build-args: |
            SPINDRIFT_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
