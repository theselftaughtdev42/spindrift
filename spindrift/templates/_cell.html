{#- One availability, from `game_id`, `platform`, `available` and `intended`. -#}
<div class="cell" role="cell" data-platform="{{ platform }}">
  {#- htmx restores focus to the same `id` after a swap; an id may not hold a space. -#}
  <button type="button"
          id="cell-{{ game_id }}-{{ platform | replace(' ', '-') }}"
          aria-pressed="{{ 'true' if available else 'false' }}"
          {% if intended %}data-intended{% endif %}
          hx-post="{{ url_for('cycle_platform', game_id=game_id, platform=platform) }}"
          hx-target="closest .row"
          hx-swap="outerHTML">
    {% if intended %}<span class="intent-marker" aria-hidden="true">&#9654;</span>{% endif %}
    <span class="cell-label">{{ platform }}</span>
  </button>
</div>
